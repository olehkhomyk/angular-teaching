<mat-card appearance="outlined" [formGroup]="form">
  <mat-card-header>
    <mat-icon matCardAvatar>biotech</mat-icon>
    <mat-card-title>Обстеження</mat-card-title>
  </mat-card-header>

  <mat-card-content class="form-grid">

    <!-- Examination type -->
    <mat-form-field appearance="outline">
      <mat-label>Тип обстеження</mat-label>
      <mat-select formControlName="examinationType">
        <mat-option value="blood">Аналіз крові</mat-option>
        <mat-option value="ultrasound">УЗД</mat-option>
        <mat-option value="mri">МРТ</mat-option>
        <mat-option value="ecg">ЕКГ</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Referral number -->
    <mat-form-field appearance="outline">
      <mat-label>Номер направлення</mat-label>
      <input matInput placeholder="REF-2026-..." formControlName="referralNumber" />
      <mat-icon matSuffix>assignment</mat-icon>
    </mat-form-field>

    <!-- Toggles -->
    <div class="toggles full-width">
      <mat-slide-toggle formControlName="isFasting">Пацієнт натще</mat-slide-toggle>
      <mat-slide-toggle formControlName="resultsReceived">Результати отримані</mat-slide-toggle>
    </div>

    <!-- Results table -->
    <div class="table-section full-width">
      <div class="table-header">
        <span class="table-label">Результати аналізів</span>
        <button mat-stroked-button (click)="addExamResult()">
          <mat-icon>add</mat-icon> Рядок
        </button>
      </div>

      @if (examResults.length > 0) {
        <table mat-table [dataSource]="examResults.controls" class="results-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Показник</th>
            <td mat-cell *matCellDef="let group">
              <input class="table-input" [formControl]="group.controls['name']" placeholder="Гемоглобін..." />
            </td>
          </ng-container>

          <ng-container matColumnDef="value">
            <th mat-header-cell *matHeaderCellDef>Значення</th>
            <td mat-cell *matCellDef="let group">
              <input class="table-input" [formControl]="group.controls['value']" placeholder="130 г/л" />
            </td>
          </ng-container>

          <ng-container matColumnDef="norm">
            <th mat-header-cell *matHeaderCellDef>Норма</th>
            <td mat-cell *matCellDef="let group">
              <input class="table-input" [formControl]="group.controls['norm']" placeholder="120–160 г/л" />
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let group; let i = index">
              <button mat-icon-button (click)="removeExamResult(i)" aria-label="Видалити рядок">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="examResultColumns"></tr>
          <tr mat-row *matRowDef="let _row; columns: examResultColumns;"></tr>
        </table>
      }
    </div>

    <!-- Conclusion — shown only when resultsReceived -->
    @if (form.controls.resultsReceived.value) {
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Висновок</mat-label>
        <textarea matInput rows="4" placeholder="Висновок лікаря за результатами..." formControlName="conclusion"></textarea>
      </mat-form-field>
    }

  </mat-card-content>

  <mat-card-actions align="end">
    @if (!isEditing) {
      <button mat-stroked-button (click)="startEditing()">
        <mat-icon>edit</mat-icon>
        Редагувати
      </button>
    } @else {
      <button mat-stroked-button (click)="cancelEditing()">
        <mat-icon>close</mat-icon>
        Скасувати
      </button>
      <button mat-flat-button (click)="onSave()">
        <mat-icon>save</mat-icon>
        Зберегти
      </button>
    }
  </mat-card-actions>
</mat-card>
