@switch (appointment().type) {
  @case (AppointmentType.Consultation) {
    <app-consultation-form [appointment]="appointment()" (save)="save.emit($event)" />
  }
  @case (AppointmentType.Examination) {
    <app-examination-form [appointment]="appointment()" (save)="save.emit($event)" />
  }
  @case (AppointmentType.Surgery) {
    <app-surgery-form [appointment]="appointment()" (save)="save.emit($event)" />
  }
}
