@if (isLoading()) {
  <div class="spinner-wrap">
    <mat-progress-spinner mode="indeterminate" diameter="40" />
  </div>
} @else if (appointment()) {
  <div class="detail-layout">

    <!-- Header -->
    <div class="detail-header">
      <button class="back-btn" routerLink="/dashboard" aria-label="Назад">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="header-info">
        <h1 class="patient-name">
          {{ appointment()!.patient.firstName }} {{ appointment()!.patient.lastName }}
        </h1>
        <div class="header-meta">
          <span>{{ appointment()!.doctorName }}</span>
          <span class="dot">·</span>
          <span>Кабінет {{ appointment()!.room }}</span>
          <span class="dot">·</span>
          <span>{{ appointment()!.date | date: 'dd MMM yyyy, HH:mm' }}</span>
        </div>
      </div>
      <app-appointment-status-badge [status]="appointment()!.status" />
    </div>

    <!-- Patient info -->
    <app-patient-info [appointment]="appointment()!" />

    <!-- Type-specific form -->
    <app-appointment-form [appointment]="appointment()!" />

  </div>
} @else {
  <div class="not-found">
    <mat-icon>search_off</mat-icon>
    <p>Прийом не знайдено</p>
    <button mat-stroked-button routerLink="/dashboard">Повернутись до списку</button>
  </div>
}
