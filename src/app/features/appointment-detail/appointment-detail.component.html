@if (isLoading()) {
  <div class="spinner-wrap">
    <mat-progress-spinner mode="indeterminate" diameter="40" />
  </div>
} @else if (appointment()) {
  <div class="detail-layout">

    <app-appointment-header
      [appointment]="appointment()!"
      [isEditing]="isEditing()"
      (editClick)="startEditing()"
      (cancelClick)="cancelEditing()"
    />

    <app-patient-info
      [appointment]="appointment()!"
      [isEditing]="isEditing()"
      (save)="savePatientInfo($event)"
    />

    <app-appointment-form
      [appointment]="appointment()!"
      [isEditing]="isEditing()"
      (save)="saveAppointment($event)"
    />

  </div>
} @else {
  <div class="not-found">
    <mat-icon>search_off</mat-icon>
    <p>Прийом не знайдено</p>
    <button mat-stroked-button routerLink="/dashboard">Повернутись до списку</button>
  </div>
}
