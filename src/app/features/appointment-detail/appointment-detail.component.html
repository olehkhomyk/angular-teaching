@if (isLoading()) {
  <div class="spinner-wrap">
    <mat-progress-spinner mode="indeterminate" diameter="40" />
  </div>
} @else if (appointment()) {
  <div class="detail-layout">
    @if (isLoading()) {
      <div class="spinner-wrap">
        <mat-progress-spinner mode="indeterminate" diameter="40" />
      </div>
    } @else {
      <app-appointment-header [appointment]="appointment()!" />
      <app-patient-info [appointment]="appointment()!"
                        (save)="savePatientInfo($event)" />
      <app-appointment-form [appointment]="appointment()!" (save)="saveAppointment($event)" />
    }

  </div>
} @else {
  <div class="not-found">
    <mat-icon>search_off</mat-icon>
    <p>Прийом не знайдено</p>
    <button mat-stroked-button routerLink="/dashboard">Повернутись до списку</button>
  </div>
}
