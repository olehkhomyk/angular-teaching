<div class="dashboard-layout">

  <!-- Left column: appointment list -->
  <section class="list-column">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Прийоми пацієнтів</mat-card-title>
        <mat-card-subtitle>Тиждень</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        @if (isLoading()) {
          <div class="spinner-wrap">
            <mat-progress-spinner mode="indeterminate" diameter="48" />
          </div>
        } @else {
          <app-patient-list
            [appointments]="appointments()"
            [selectedId]="selectedAppointmentId()"
            (selectAppointment)="onSelectAppointment($event)"
          />
        }
      </mat-card-content>
    </mat-card>
  </section>

  <!-- Right column -->
  <section class="detail-column">
    <mat-card appearance="outlined" class="detail-card">

      @if (selectedAppointment(); as appt) {
        <app-appointment-preview [appointment]="appt" />
      } @else {
        <div class="empty-state">
          <mat-icon class="empty-icon">touch_app</mat-icon>
          <h2>Оберіть прийом</h2>
          <p>Натисніть на рядок зліва, щоб побачити деталі</p>
        </div>
      }

    </mat-card>
  </section>

</div>
