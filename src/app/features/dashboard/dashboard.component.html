<div class="dashboard-layout">

  <!-- Left column: appointment list -->
  <section class="list-column">
    <div class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">Прийоми пацієнтів</h2>
          <p class="panel-subtitle">Поточний тиждень</p>
        </div>
        <div class="appt-count">
          @if (!isLoading()) {
            <span class="count-badge">{{ filteredAppointments().length }}</span>
          }
        </div>
      </div>

      <app-appointments-filter (filterChange)="onFilterChange($event)" />

      <div class="panel-body">
        @if (isLoading()) {
          <div class="spinner-wrap">
            <mat-progress-spinner mode="indeterminate" diameter="40" />
          </div>
        } @else {
          <app-patient-list
            [appointments]="filteredAppointments()"
            [selectedId]="selectedAppointmentId()"
            (selectAppointment)="onSelectAppointment($event)"
          />
        }
      </div>
    </div>
  </section>

  <!-- Right column -->
  <section class="detail-column">
    <div class="panel detail-panel">
      @if (selectedAppointment(); as appt) {
        <app-appointment-preview [appointment]="appt" />
      } @else {
        <div class="empty-state">
          <div class="empty-icon-wrap">
            <mat-icon class="empty-icon">touch_app</mat-icon>
          </div>
          <h2 class="empty-title">Оберіть прийом</h2>
          <p class="empty-sub">Натисніть на рядок зліва, щоб побачити деталі пацієнта</p>
        </div>
      }
    </div>
  </section>

</div>
